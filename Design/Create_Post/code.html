<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AIBA Community Hub - Create New Post</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Nunito+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#e8e4ff",
                        "on-primary-fixed-variant": "#3824c7",
                        "on-secondary-fixed-variant": "#5e4100",
                        "tertiary": "#005b42",
                        "inverse-primary": "#c4c0ff",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#5b4fe8",
                        "on-background": "#1a1a2e",
                        "inverse-on-surface": "#f2efff",
                        "surface-variant": "#e2e0fc",
                        "background": "#fcf8ff",
                        "surface-dim": "#dad7f3",
                        "on-secondary-container": "#6b4b00",
                        "secondary-container": "#ffb702",
                        "surface": "#fcf8ff",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#ffdea9",
                        "on-error": "#ffffff",
                        "surface-container-high": "#e8e5ff",
                        "tertiary-container": "#007657",
                        "outline": "#777586",
                        "on-tertiary-fixed-variant": "#00513b",
                        "error-container": "#ffdad6",
                        "secondary": "#7d5800",
                        "primary-fixed-dim": "#c4c0ff",
                        "on-primary-fixed": "#120068",
                        "on-tertiary-fixed": "#002116",
                        "outline-variant": "#c8c4d8",
                        "surface-bright": "#fcf8ff",
                        "on-primary": "#ffffff",
                        "surface-tint": "#5244de",
                        "surface-container-low": "#f5f2ff",
                        "secondary-fixed-dim": "#ffba27",
                        "on-secondary": "#ffffff",
                        "primary": "#4231cf",
                        "tertiary-fixed-dim": "#27e0a9",
                        "tertiary-fixed": "#54fdc4",
                        "primary-fixed": "#e3dfff",
                        "on-surface": "#1a1a2e",
                        "on-surface-variant": "#464555",
                        "surface-container": "#efecff",
                        "surface-container-highest": "#e2e0fc",
                        "on-secondary-fixed": "#271900",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#77ffcc",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2f2e43"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "container-padding-mobile": "24px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "unit": "8px",
                        "gutter": "16px",
                        "container-padding-desktop": "40px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Nunito Sans"],
                        "headline-md": ["Nunito Sans"],
                        "display-hero": ["Nunito Sans"],
                        "body-lg": ["Inter"],
                        "caption": ["Inter"],
                        "label-md": ["Nunito Sans"],
                        "headline-lg-mobile": ["Nunito Sans"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "1.3", "fontWeight": "800"}],
                        "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "700"}],
                        "display-hero": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "caption": ["12px", {"lineHeight": "1.2", "fontWeight": "500"}],
                        "label-md": ["16px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "1.3", "fontWeight": "800"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e0fc; border-radius: 10px; }
        .glass-effect { backdrop-filter: blur(8px); }
        .faux-3d-press:active { transform: translateY(2px); box-shadow: none !important; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(91, 79, 232, 0.1); }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased overflow-hidden">
<!-- Community Hub Background (Simulated) -->
<header class="bg-surface/80 backdrop-blur-md border-b border-outline-variant/30 fixed top-0 w-full z-10">
<div class="flex justify-between items-center w-full px-6 md:px-10 max-w-7xl mx-auto h-16 md:h-20">
<span class="text-headline-md font-headline-md font-extrabold text-primary">AIBA</span>
<nav class="hidden md:flex gap-gutter">
<a class="text-on-surface-variant font-label-md hover:text-primary transition-colors duration-200" href="#">Features</a>
<a class="text-on-surface-variant font-label-md hover:text-primary transition-colors duration-200" href="#">How it Works</a>
<a class="text-on-surface-variant font-label-md hover:text-primary transition-colors duration-200" href="#">Pricing</a>
<a class="text-primary border-b-2 border-primary font-bold pb-1" href="#">Community</a>
</nav>
<div class="flex gap-stack-sm">
<button class="px-4 py-2 font-label-md text-primary hover:bg-primary/5 rounded-xl transition-all">Login</button>
<button class="px-6 py-2 bg-primary text-on-primary font-label-md rounded-full shadow-lg shadow-primary/20 hover:scale-105 transition-transform">Get Started</button>
</div>
</div>
</header>
<main class="pt-24 px-6 max-w-7xl mx-auto opacity-40 select-none pointer-events-none">
<h1 class="font-headline-lg text-headline-lg mb-stack-lg">Community Hub</h1>
<div class="grid grid-cols-1 md:grid-cols-3 gap-gutter">
<div class="md:col-span-2 space-y-gutter">
<div class="h-40 bg-surface-container rounded-xl border border-outline-variant"></div>
<div class="h-40 bg-surface-container rounded-xl border border-outline-variant"></div>
</div>
<div class="space-y-gutter">
<div class="h-80 bg-surface-container rounded-xl border border-outline-variant"></div>
</div>
</div>
</main>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-on-background/40 glass-effect">
<div class="bg-surface w-full max-w-2xl max-h-[921px] rounded-[2rem] border border-outline-variant shadow-2xl flex flex-col overflow-hidden relative">
<!-- Modal Header -->
<div class="p-6 md:p-8 flex items-center justify-between border-b border-outline-variant/30 bg-surface-container-lowest">
<h2 class="font-headline-md text-headline-md text-on-surface flex items-center gap-stack-sm">
                    Create a New Post ✏️
                </h2>
<button aria-label="Close modal" class="p-2 hover:bg-surface-container-high rounded-full transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-[28px]">close</span>
</button>
</div>
<!-- Modal Content (Scrollable Area) -->
<div class="flex-1 overflow-y-auto p-6 md:p-8 space-y-stack-lg custom-scrollbar">
<!-- Category Selector -->
<div>
<label class="block font-label-md text-on-surface-variant mb-stack-sm">Choose a Category</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-stack-sm">
<button class="category-btn flex flex-col items-center gap-1 p-3 rounded-xl border-2 border-outline-variant bg-surface-container-low hover:border-primary transition-all group" onclick="selectCategory(this)">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">lightbulb</span>
<span class="font-label-md text-sm">Study Tips</span>
</button>
<button class="category-btn flex flex-col items-center gap-1 p-3 rounded-xl border-2 border-outline-variant bg-surface-container-low hover:border-primary transition-all group" onclick="selectCategory(this)">
<span class="material-symbols-outlined text-secondary group-hover:scale-110 transition-transform">emoji_events</span>
<span class="font-label-md text-sm">Success</span>
</button>
<button class="category-btn flex flex-col items-center gap-1 p-3 rounded-xl border-2 border-outline-variant bg-surface-container-low hover:border-primary transition-all group" onclick="selectCategory(this)">
<span class="material-symbols-outlined text-tertiary group-hover:scale-110 transition-transform">question_answer</span>
<span class="font-label-md text-sm">Questions</span>
</button>
<button class="category-btn flex flex-col items-center gap-1 p-3 rounded-xl border-2 border-outline-variant bg-surface-container-low hover:border-primary transition-all group" onclick="selectCategory(this)">
<span class="material-symbols-outlined text-on-surface-variant group-hover:scale-110 transition-transform">groups</span>
<span class="font-label-md text-sm">Groups</span>
</button>
</div>
</div>
<!-- Guidelines -->
<div class="bg-secondary-fixed/30 p-4 rounded-xl border border-secondary/20 flex gap-stack-sm items-start">
<span class="material-symbols-outlined text-secondary text-[20px]">info</span>
<p class="font-body-md text-on-secondary-fixed-variant leading-tight">
                        💛 Be kind, be helpful, keep it relevant!
                    </p>
</div>
<!-- Inputs -->
<div class="space-y-stack-md">
<div>
<label class="block font-label-md text-on-surface-variant mb-stack-sm" for="post-title">Title</label>
<input class="w-full px-4 py-3 rounded-xl bg-surface-container-low border-none ring-1 ring-outline-variant focus:ring-2 focus:ring-primary transition-all font-body-md" id="post-title" placeholder="What's on your mind?" type="text"/>
</div>
<div>
<label class="block font-label-md text-on-surface-variant mb-stack-sm" for="post-body">Your Thoughts</label>
<div class="bg-surface-container-low rounded-xl ring-1 ring-outline-variant focus-within:ring-2 focus-within:ring-primary overflow-hidden">
<!-- Simple Rich Text Toolbar Simulation -->
<div class="flex gap-2 p-2 border-b border-outline-variant/30 bg-surface-container">
<button class="p-1.5 hover:bg-surface-container-high rounded transition-colors"><span class="material-symbols-outlined text-[20px]">format_bold</span></button>
<button class="p-1.5 hover:bg-surface-container-high rounded transition-colors"><span class="material-symbols-outlined text-[20px]">format_italic</span></button>
<button class="p-1.5 hover:bg-surface-container-high rounded transition-colors"><span class="material-symbols-outlined text-[20px]">format_list_bulleted</span></button>
<button class="p-1.5 hover:bg-surface-container-high rounded transition-colors"><span class="material-symbols-outlined text-[20px]">link</span></button>
</div>
<textarea class="w-full p-4 border-none bg-transparent focus:ring-0 font-body-md resize-none" id="post-body" placeholder="Write your post here... Use @ to mention or # for topics." rows="6"></textarea>
</div>
</div>
</div>
<!-- Image Upload Area -->
<div>
<label class="block font-label-md text-on-surface-variant mb-stack-sm">Add Photos</label>
<div class="border-2 border-dashed border-outline-variant rounded-2xl p-8 flex flex-col items-center justify-center bg-surface-container-low/50 hover:bg-primary-container/5 hover:border-primary transition-all cursor-pointer group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mb-stack-sm group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary">add_photo_alternate</span>
</div>
<p class="font-label-md text-on-surface-variant">Drag and drop or <span class="text-primary underline">browse</span></p>
<p class="font-caption text-outline mt-1">High-quality JPG, PNG, or GIF up to 10MB</p>
</div>
</div>
<!-- Tags Input -->
<div>
<label class="block font-label-md text-on-surface-variant mb-stack-sm" for="tags">Tags</label>
<div class="flex flex-wrap gap-stack-sm items-center px-4 py-3 rounded-xl bg-surface-container-low ring-1 ring-outline-variant focus-within:ring-2 focus-within:ring-primary transition-all">
<span class="bg-primary/10 text-primary px-3 py-1 rounded-full font-label-md text-sm flex items-center gap-1">
                            #learning
                            <span class="material-symbols-outlined text-[14px] cursor-pointer">close</span>
</span>
<input class="border-none bg-transparent focus:ring-0 p-0 font-body-md flex-1 min-w-[120px]" id="tags" placeholder="Add a tag..." type="text"/>
</div>
</div>
</div>
<!-- Modal Actions -->
<div class="p-6 md:p-8 bg-surface-container-lowest border-t border-outline-variant/30 flex flex-col md:flex-row-reverse gap-stack-md">
<button class="w-full md:flex-1 py-4 bg-secondary-container text-on-secondary-container font-headline-md rounded-2xl shadow-lg shadow-secondary-container/20 hover:shadow-xl hover:-translate-y-0.5 faux-3d-press transition-all">
                    Publish Post
                </button>
<button class="w-full md:w-auto px-8 py-4 font-label-md text-on-surface-variant hover:bg-surface-container-high rounded-2xl transition-colors">
                    Save Draft
                </button>
</div>
</div>
</div>
<!-- Background Decoration -->
<div class="fixed top-[15%] left-[5%] w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="fixed bottom-[10%] right-[10%] w-96 h-96 bg-secondary/5 rounded-full blur-3xl -z-10"></div>
<script>
        function selectCategory(btn) {
            // Reset all category buttons
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('border-primary', 'bg-primary/5', 'ring-2', 'ring-primary/20');
                b.classList.add('border-outline-variant', 'bg-surface-container-low');
            });
            // Highlight selected button
            btn.classList.add('border-primary', 'bg-primary/5', 'ring-2', 'ring-primary/20');
            btn.classList.remove('border-outline-variant', 'bg-surface-container-low');
        }

        // Initialize state
        document.addEventListener('DOMContentLoaded', () => {
            // Focus title input on load
            document.getElementById('post-title').focus();
        });
    </script>
</body></html>
