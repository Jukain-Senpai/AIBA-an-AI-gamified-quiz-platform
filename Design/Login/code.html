<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Simple form interaction simulation
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = 'Connecting...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            setTimeout(() => {
                btn.innerText = 'Success! ✨';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-tertiary-container');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('opacity-80', 'cursor-not-allowed', 'bg-tertiary-container');
                    btn.classList.add('bg-primary');
                }, 2000);
            }, 1500);
        });

        // Add interaction styles to inputs
        const inputs = document.querySelectorAll('.input-pill');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });
    </script>
