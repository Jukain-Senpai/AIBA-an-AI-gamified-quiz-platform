<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .step-active {
            box-shadow: 0 0 0 4px rgba(91, 79, 232, 0.15);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 224, 240, 1);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #5b4fe8;
            box-shadow: 0 0 0 4px rgba(91, 79, 232, 0.1);
        }
        .gradient-btn {
            background: linear-gradient(135deg, #4231cf 0%, #7d5800 100%);
        }
        .indigo-gradient-text {
            background: linear-gradient(135deg, #4231cf, #5b4fe8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant/30 shadow-sm h-20">
<div class="flex justify-between items-center w-full px-container-padding-mobile md:px-container-padding-desktop max-w-7xl mx-auto h-full">
<div class="text-headline-md font-headline-md font-extrabold text-primary tracking-tight">AIBA</div>
<nav class="hidden md:flex items-center gap-8">
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors font-label-md text-label-md" href="#">Features</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors font-label-md text-label-md" href="#">How it Works</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors font-label-md text-label-md" href="#">Pricing</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors font-label-md text-label-md" href="#">Community</a>
</nav>
<div class="flex items-center gap-4">
<button class="px-6 py-2 text-primary font-bold hover:bg-surface-container-high rounded-full transition-all duration-300 font-label-md text-label-md active:scale-95">Log In</button>
<button class="px-6 py-2 bg-primary text-on-primary font-bold rounded-full shadow-lg hover:shadow-primary/20 active:scale-95 transition-all duration-300 font-label-md text-label-md">Join Free</button>
</div>
</div>
</header>
<main class="pt-28 pb-32 px-container-padding-mobile md:px-container-padding-desktop max-w-4xl mx-auto">
<!-- Progress Wizard -->
<section class="mb-12">
<div class="relative flex justify-between items-center max-w-md mx-auto">
<!-- Progress Line Background -->
<div class="absolute top-1/2 left-0 w-full h-1 bg-surface-container-highest -translate-y-1/2 rounded-full z-0"></div>
<!-- Active Progress Line -->
<div class="absolute top-1/2 left-0 w-1/4 h-1 bg-primary -translate-y-1/2 rounded-full z-0"></div>
<!-- Step 1 -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold step-active">1</div>
<span class="font-label-md text-label-md text-primary font-bold">Setup</span>
</div>
<!-- Step 2 -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-bold">2</div>
<span class="font-label-md text-label-md text-on-surface-variant">Questions</span>
</div>
<!-- Step 3 -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-bold">3</div>
<span class="font-label-md text-label-md text-on-surface-variant">Review</span>
</div>
</div>
</section>
<!-- Form Content -->
<div class="glass-card rounded-[2rem] p-8 md:p-12 shadow-[0_20px_50px_rgba(91,79,232,0.06)] relative overflow-hidden">
<!-- Decorative Gradient Blob -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-secondary-container/10 blur-3xl rounded-full"></div>
<div class="relative z-10">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Let's Set Up Your Quiz 📝</h1>
<p class="text-on-surface-variant font-body-md mb-8">Tell us about your masterpiece. This will help learners find your quiz.</p>
<form class="space-y-stack-lg">
<!-- Quiz Title -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1">Quiz Title</label>
<input class="w-full px-6 py-4 bg-surface-container-low border border-outline-variant rounded-xl text-body-lg font-medium transition-all focus:ring-0" placeholder="e.g., Solar System Basics" type="text"/>
</div>
<!-- Description -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1">Description (Optional)</label>
<textarea class="w-full px-6 py-4 bg-surface-container-low border border-outline-variant rounded-xl text-body-md transition-all focus:ring-0" placeholder="What will people learn in this quiz?" rows="3"></textarea>
</div>
<!-- Category Selector -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1 mb-3">Category</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
<button class="group flex items-center justify-center gap-2 p-3 rounded-full border border-outline-variant bg-white hover:border-primary hover:bg-surface-container transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="science">science</span>
<span class="font-label-md text-label-md">Science</span>
</button>
<button class="group flex items-center justify-center gap-2 p-3 rounded-full border-2 border-primary bg-surface-container transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="functions" style="font-variation-settings: 'FILL' 1;">functions</span>
<span class="font-label-md text-label-md text-primary font-bold">Math</span>
</button>
<button class="group flex items-center justify-center gap-2 p-3 rounded-full border border-outline-variant bg-white hover:border-primary hover:bg-surface-container transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="history">history</span>
<span class="font-label-md text-label-md">History</span>
</button>
<button class="group flex items-center justify-center gap-2 p-3 rounded-full border border-outline-variant bg-white hover:border-primary hover:bg-surface-container transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="palette">palette</span>
<span class="font-label-md text-label-md">Arts</span>
</button>
</div>
</div>
<div class="grid md:grid-cols-2 gap-stack-lg pt-4">
<!-- Difficulty Selector -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1">Difficulty Level</label>
<div class="flex items-center gap-2 bg-surface-container-low p-4 rounded-xl border border-outline-variant">
<div class="flex gap-1" id="difficulty-stars">
<button class="material-symbols-outlined text-secondary-container text-2xl" data-icon="star" style="font-variation-settings: 'FILL' 1;" type="button">star</button>
<button class="material-symbols-outlined text-secondary-container text-2xl" data-icon="star" style="font-variation-settings: 'FILL' 1;" type="button">star</button>
<button class="material-symbols-outlined text-secondary-container text-2xl" data-icon="star" style="font-variation-settings: 'FILL' 1;" type="button">star</button>
<button class="material-symbols-outlined text-outline-variant text-2xl" data-icon="star" type="button">star</button>
<button class="material-symbols-outlined text-outline-variant text-2xl" data-icon="star" type="button">star</button>
</div>
<span class="ml-auto font-label-md text-label-md text-on-surface-variant">Intermediate</span>
</div>
</div>
<!-- Time Limit -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1">Time per Question</label>
<div class="bg-surface-container-low p-4 rounded-xl border border-outline-variant space-y-3">
<div class="flex justify-between font-label-md text-label-md">
<span class="text-primary font-bold" id="timer-val">30s</span>
<span class="text-on-surface-variant">Max: 120s</span>
</div>
<input class="w-full h-2 bg-surface-container-highest rounded-lg appearance-none cursor-pointer accent-primary" id="time-slider" max="120" min="10" type="range" value="30"/>
</div>
</div>
</div>
<!-- Visibility Toggle -->
<div class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1">Visibility</label>
<div class="flex p-1 bg-surface-container border border-outline-variant rounded-2xl">
<button class="flex-1 py-3 px-4 rounded-xl bg-white shadow-sm flex items-center justify-center gap-2 transition-all" type="button">
<span class="material-symbols-outlined text-primary text-xl" data-icon="public">public</span>
<span class="font-label-md text-label-md font-bold">Public</span>
</button>
<button class="flex-1 py-3 px-4 rounded-xl flex items-center justify-center gap-2 text-on-surface-variant hover:bg-surface-container-high transition-all" type="button">
<span class="material-symbols-outlined text-xl" data-icon="group">group</span>
<span class="font-label-md text-label-md">Friends</span>
</button>
<button class="flex-1 py-3 px-4 rounded-xl flex items-center justify-center gap-2 text-on-surface-variant hover:bg-surface-container-high transition-all" type="button">
<span class="material-symbols-outlined text-xl" data-icon="lock">lock</span>
<span class="font-label-md text-label-md">Private</span>
</button>
</div>
</div>
</form>
</div>
</div>
</main>
<!-- Footer Action Bar -->
<footer class="fixed bottom-0 w-full bg-surface-container-low border-t border-outline-variant shadow-[0_-10px_30px_rgba(0,0,0,0.03)] py-6 z-40">
<div class="max-w-4xl mx-auto px-container-padding-mobile flex justify-between items-center">
<button class="px-8 py-3 text-on-surface-variant font-bold hover:bg-surface-container-high rounded-full transition-all active:scale-95 flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
                Cancel
            </button>
<button class="px-10 py-4 bg-secondary-container text-on-secondary-container font-black rounded-full shadow-lg hover:shadow-secondary-container/20 hover:-translate-y-0.5 active:translate-y-0.5 transition-all flex items-center gap-3">
                Next
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
<script>
        // Micro-interactions
        const slider = document.getElementById('time-slider');
        const timerVal = document.getElementById('timer-val');
        
        slider.addEventListener('input', (e) => {
            timerVal.textContent = e.target.value + 's';
        });

        // Simple interactive stars logic
        const starsContainer = document.getElementById('difficulty-stars');
        const stars = starsContainer.getElementsByTagName('button');
        
        Array.from(stars).forEach((star, index) => {
            star.addEventListener('click', () => {
                Array.from(stars).forEach((s, i) => {
                    if(i <= index) {
                        s.classList.add('text-secondary-container');
                        s.classList.remove('text-outline-variant');
                        s.style.fontVariationSettings = "'FILL' 1";
                    } else {
                        s.classList.remove('text-secondary-container');
                        s.classList.add('text-outline-variant');
                        s.style.fontVariationSettings = "'FILL' 0";
                    }
                });
            });
        });
    </script>
</body></html>
